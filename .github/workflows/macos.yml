name: macOS
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  Build:
    name: ARM64 (Hypervisor.framework)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install llvm lld
          # Prepend (GITHUB_PATH only appends, which leaves the runner's
          # /usr/bin/ld.lld shim shadowing Homebrew's real lld).
          echo "PATH=/opt/homebrew/opt/llvm/bin:$PATH" >> "$GITHUB_ENV"
      - name: Build
        # Serial make: the tender build system has a known race where the
        # debug and non-debug objects of the same source file share one .Td
        # dependency file under parallel make.
        run: |
          ./configure.sh
          make
      # Build-only: GitHub-hosted macOS runners are themselves virtual
      # machines without nested virtualization — hv_vm_create fails with
      # HV_NOT_SUPPORTED (0xfae9400f), so no guest can boot in CI. The
      # tender, toolchain and all test images (incl. test_hcfloor) are
      # still compile-verified here; running them requires real Apple
      # Silicon (the make-built tender boots them directly, see
      # docs/building.md).
